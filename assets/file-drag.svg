<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="File drag reference demo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.6" stop-color="#111a33"/>
      <stop offset="1" stop-color="#1b1233"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#64748b" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#818cf8"/>
    </marker>
  </defs>
  <rect width="1000" height="360" fill="url(#bg)"/>
  <rect width="1000" height="360" fill="url(#grid)"/>
  <circle cx="120" cy="30" r="190" fill="#6366f1" opacity="0.10" filter="url(#soft)"/>
  <circle cx="940" cy="340" r="170" fill="#22d3ee" opacity="0.05" filter="url(#soft)"/>
  <g transform="translate(48 38)">
    <rect width="42" height="42" rx="12" fill="#151b2e" stroke="#818cf8" stroke-opacity="0.6"/>
    <path d="M21 9l3.1 9.4L33.5 21l-9.4 3.1L21 33.5l-3.1-9.4L8.5 21l9.4-3.1z" fill="url(#accent)"/>
    <text x="58" y="19" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700">📎 File drag reference</text>
    <text x="58" y="40" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="13">Drop a path into the composer — the file stays where it is.</text>
  </g>
  <!-- file tree -->
  <g transform="translate(48 112)">
    <rect width="300" height="204" rx="14" fill="#0f172a" stroke="#334155" stroke-opacity="0.9"/>
    <text x="16" y="26" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">FILES</text>
    <text x="16" y="52" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11">src</text>
    <text x="34" y="76" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">client</text>
    <text x="34" y="100" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">index.ts</text>
    <rect x="14" y="116" width="272" height="30" rx="7" fill="#151b2e" stroke="#22d3ee" stroke-opacity="0.75"/>
    <path d="M26 122h12l4 4h14v14H26z" fill="none" stroke="#22d3ee" stroke-width="1.4"/>
    <text x="62" y="136" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="11">README.md</text>
    <text x="16" y="170" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="10">Drag a file or folder</text>
    <text x="16" y="188" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="10">into the composer →</text>
  </g>

  <!-- connector -->
  <path d="M 326 132 C 360 132 360 174 390 174" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)" opacity="0.9"/>

  <!-- composer -->
  <g transform="translate(392 120)">
    <rect width="560" height="184" rx="14" fill="#0f172a" stroke="#334155"/>
    <text x="18" y="27" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">COMPOSER</text>
    <rect x="18" y="42" width="524" height="86" rx="10" fill="#111827" stroke="#22d3ee" stroke-opacity="0.65"/>
    <rect x="32" y="56" width="150" height="24" rx="12" fill="#151b2e" stroke="#22d3ee" stroke-opacity="0.55"/>
    <text x="44" y="72" fill="#22d3ee" font-family="Consolas, monospace" font-size="11">@README.md</text>
    <text x="32" y="104" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">Explain this file…</text>
    <text x="18" y="148" fill="#22d3ee" font-family="Segoe UI, Arial, sans-serif" font-size="11">Drop to reference README.md</text>
    <circle cx="528" cy="150" r="12" fill="#151b2e" stroke="#334155"/>
    <path d="M522 150l4 4 7-8" fill="none" stroke="#34d399" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(740 262)">
    <circle cx="8" cy="8" r="4" fill="#34d399"/>
    <text x="20" y="12" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="10">no move · no copy · no upload</text>
  </g>
</svg>
