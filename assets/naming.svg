<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="New conversation naming demo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.6" stop-color="#111a33"/>
      <stop offset="1" stop-color="#1b1233"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#64748b" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#818cf8"/>
    </marker>
  </defs>
  <rect width="1000" height="360" fill="url(#bg)"/>
  <rect width="1000" height="360" fill="url(#grid)"/>
  <circle cx="120" cy="30" r="190" fill="#6366f1" opacity="0.10" filter="url(#soft)"/>
  <circle cx="940" cy="340" r="170" fill="#22d3ee" opacity="0.05" filter="url(#soft)"/>
  <g transform="translate(48 38)">
    <rect width="42" height="42" rx="12" fill="#151b2e" stroke="#818cf8" stroke-opacity="0.6"/>
    <path d="M21 9l3.1 9.4L33.5 21l-9.4 3.1L21 33.5l-3.1-9.4L8.5 21l9.4-3.1z" fill="url(#accent)"/>
    <text x="58" y="19" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700">✏️ New conversation naming</text>
    <text x="58" y="40" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="13">Name it before you create it — no more “New Session”.</text>
  </g>
  <!-- sidebar -->
  <g transform="translate(48 112)">
    <rect width="300" height="204" rx="14" fill="#0f172a" stroke="#334155" stroke-opacity="0.9"/>
    <rect x="14" y="14" width="272" height="34" rx="9" fill="#111827"/>
    <circle cx="30" cy="31" r="6" fill="#818cf8"/>
    <text x="44" y="36" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">dsh-enhance</text>
    <circle cx="258" cy="31" r="10" fill="#151b2e" stroke="#818cf8" stroke-opacity="0.7"/>
    <path d="M258 26v10M253 31h10" stroke="#22d3ee" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="18" y="62" width="264" height="26" rx="7" fill="#151b2e" stroke="#818cf8" stroke-opacity="0.55"/>
    <text x="30" y="80" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="11">New session</text>
    <rect x="18" y="98" width="220" height="9" rx="4.5" fill="#334155"/>
    <rect x="18" y="116" width="246" height="9" rx="4.5" fill="#334155"/>
    <rect x="18" y="140" width="80" height="8" rx="4" fill="#64748b"/>
    <rect x="18" y="158" width="244" height="9" rx="4.5" fill="#334155"/>
    <rect x="18" y="176" width="198" height="9" rx="4.5" fill="#334155"/>
  </g>

  <!-- connector -->
  <path d="M 326 140 C 356 140 356 120 386 120" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)" opacity="0.9"/>

  <!-- dialog -->
  <g transform="translate(388 92)">
    <rect width="564" height="228" rx="16" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.45"/>
    <circle cx="26" cy="28" r="14" fill="#151b2e"/>
    <path d="M20 28h12M26 22v12" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round"/>
    <text x="50" y="27" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700">Name new conversation</text>
    <text x="50" y="45" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="11">Create a conversation in “dsh-enhance”</text>
    <text x="26" y="82" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">Conversation name</text>
    <rect x="26" y="92" width="512" height="38" rx="9" fill="#111827" stroke="#818cf8" stroke-opacity="0.7"/>
    <text x="40" y="116" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="14">Fix login flow</text>
    <text x="26" y="148" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="10">Saved as the conversation title; rename it later.</text>
    <text x="26" y="202" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">Skip naming</text>
    <rect x="382" y="184" width="156" height="32" rx="8" fill="url(#accent)"/>
    <text x="460" y="204" text-anchor="middle" fill="#0b1020" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">Create conversation</text>
  </g>
</svg>
