<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="Floating ball and chat width demo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.6" stop-color="#111a33"/>
      <stop offset="1" stop-color="#1b1233"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#64748b" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#818cf8"/>
    </marker>
  </defs>
  <rect width="1000" height="360" fill="url(#bg)"/>
  <rect width="1000" height="360" fill="url(#grid)"/>
  <circle cx="120" cy="30" r="190" fill="#6366f1" opacity="0.10" filter="url(#soft)"/>
  <circle cx="940" cy="340" r="170" fill="#22d3ee" opacity="0.05" filter="url(#soft)"/>
  <g transform="translate(48 38)">
    <rect width="42" height="42" rx="12" fill="#151b2e" stroke="#818cf8" stroke-opacity="0.6"/>
    <path d="M21 9l3.1 9.4L33.5 21l-9.4 3.1L21 33.5l-3.1-9.4L8.5 21l9.4-3.1z" fill="url(#accent)"/>
    <text x="58" y="19" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="23" font-weight="700">🫧 Floating ball &amp; chat width</text>
    <text x="58" y="40" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="13">38–90rem, default 48rem — synced with the native width handle.</text>
  </g>
  <!-- quick panel -->
  <g transform="translate(360 96)">
    <rect width="506" height="238" rx="16" fill="#0f172a" stroke="#818cf8" stroke-opacity="0.45"/>
    <text x="22" y="30" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="700">Quick panel</text>
    <text x="22" y="48" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="10">DSH Enhance · conversation tools</text>

    <text x="22" y="82" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11">Chat width</text>
    <text x="436" y="82" text-anchor="end" fill="#22d3ee" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">48rem</text>
    <rect x="22" y="92" width="420" height="6" rx="3" fill="#334155"/>
    <rect x="22" y="92" width="210" height="6" rx="3" fill="url(#accent)"/>
    <circle cx="232" cy="95" r="8" fill="#f8fafc" stroke="#818cf8" stroke-width="3"/>
    <text x="22" y="118" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="9">38rem</text>
    <text x="442" y="118" text-anchor="end" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="9">90rem</text>

    <line x1="22" y1="136" x2="484" y2="136" stroke="#1f2937"/>
    <text x="22" y="158" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11">Message timeline</text>
    <rect x="424" y="146" width="58" height="20" rx="10" fill="#818cf8" opacity="0.85"/>
    <circle cx="472" cy="156" r="7" fill="#f8fafc"/>
    <text x="22" y="184" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11">Hide native turn navigation</text>
    <rect x="424" y="172" width="58" height="20" rx="10" fill="#818cf8" opacity="0.85"/>
    <circle cx="472" cy="182" r="7" fill="#f8fafc"/>
    <text x="22" y="210" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="11">Name new conversations</text>
    <rect x="424" y="198" width="58" height="20" rx="10" fill="#818cf8" opacity="0.85"/>
    <circle cx="472" cy="208" r="7" fill="#f8fafc"/>
    <text x="22" y="230" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="9">Reset floating ball position</text>
  </g>

  <!-- ball -->
  <g transform="translate(890 270)">
    <circle r="26" fill="#151b2e" stroke="#818cf8" stroke-opacity="0.75"/>
    <path d="M-9 2l4.2-4.2L0 2l4.8-6L9 2" fill="none" stroke="#22d3ee" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="12" cy="-12" r="3" fill="#a78bfa"/>
  </g>
  <path d="M 864 272 C 830 272 820 246 800 238" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)" opacity="0.8"/>
</svg>
